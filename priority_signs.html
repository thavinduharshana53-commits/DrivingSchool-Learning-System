<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priority Signs</title>
   <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/subsigns.css">
</head>

<body>
  <h1>🛑 Priority Signs</h1>
  <div class="road_Signs">
    <div class="all_cards">

      <div class="pri_signs">
        <img src="img/Priority_signs/LK_road_sign_PRS-01.svg" alt="imf2">
        <span>01. Stop to give priority</span>
      </div>

      <div class="pri_signs">
        <img src="img/Priority_signs/Vienna_Convention_road_sign_B1-V1.svg" alt="imf2">
        <span>02. Give way to vehicles on the adjacent road</span>
      </div>

      <div class="pri_signs">
        <img src="img/Priority_signs/Vienna_Convention_road_sign_B3-V1.svg" alt="imf2">
        <span>03. Priority road</span>
      </div>

      <div class="pri_signs">
        <img src="img/Priority_signs/Vienna_Convention_road_sign_B4-V1.svg" alt="imf2">
        <span>04. End of priority road</span>
      </div>

      <div class="pri_signs">
        <img src="img/Priority_signs/Vienna_Convention_road_sign_B5-V1-LHT.svg" alt="imf2">
        <span>05. Give way to oncoming traffic</span>
      </div>

      <div class="pri_signs">
        <img src="img/Priority_signs/Vienna_Convention_road_sign_B6-LHT.svg" alt="imf2">
        <span>06. Priority over oncoming traffic</span>
      </div>
    </div>
  </div>
</body>

</html>
