<?xml version="1.0" encoding="UTF-8"?>
<!-- Decorative hero illustration: abstract gradient shapes and tech elements -->
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#90e0ef"/>
      <stop offset="100%" stop-color="#03045e"/>
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
  </defs>

  <!-- Soft blob background -->
  <g opacity="0.95">
    <path fill="url(#g1)" opacity="0.12" d="M120 480C40 420 10 300 100 220C190 140 360 130 500 170C640 210 740 300 700 420C660 540 300 560 120 480Z" filter="url(#f1)"/>
    <path fill="#caf0f8" opacity="0.18" d="M200 520C120 460 80 340 160 260C240 180 420 160 560 200C700 240 760 330 720 450C680 570 420 600 200 520Z"/>
  </g>

  <!-- Device mockup / abstract UI cards -->
  <g transform="translate(280,150)">
    <rect x="0" y="0" width="260" height="360" rx="18" fill="#ffffff" opacity="0.95" stroke="#e6f4fb"/>
    <rect x="16" y="20" width="228" height="80" rx="10" fill="#edf6fb"/>
    <rect x="16" y="120" width="110" height="18" rx="8" fill="#caf0f8"/>
    <rect x="16" y="150" width="200" height="100" rx="10" fill="#90e0ef" opacity="0.95"/>
    <circle cx="220" cy="320" r="6" fill="#03045e"/>
    <circle cx="196" cy="320" r="6" fill="#03045e"/>
  </g>

  <!-- Floating accent circles -->
  <circle cx="160" cy="120" r="28" fill="#48cae4" opacity="0.6"/>
  <circle cx="620" cy="80" r="18" fill="#90e0ef" opacity="0.7"/>

  <!-- Lines / connection dots -->
  <g stroke="#03045e" stroke-opacity="0.08" stroke-width="2">
    <path d="M220 260 C300 230 420 210 500 230" fill="none" stroke-linecap="round"/>
    <circle cx="220" cy="260" r="4" fill="#03045e" />
    <circle cx="500" cy="230" r="4" fill="#03045e" />
  </g>

  <!-- Tiny decorative squares -->
  <g fill="#03045e" opacity="0.14">
    <rect x="60" y="360" width="8" height="8" rx="1"/>
    <rect x="100" y="300" width="6" height="6" rx="1"/>
    <rect x="720" y="520" width="10" height="10" rx="2"/>
  </g>

</svg>
